[project]
name = "hubbit"
version = "0.3.0"
description = "Unofficial experiments with LEGO BOOST (Move Hub 88006) from Python via pylgbst - no LEGO app needed."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<3.14"
dependencies = [
    "prompt-toolkit>=3.0",
    "pylgbst[bleak]",
    "textual>=8.2.8",
]

[project.scripts]
hubbit-scan = "hubbit.scan:main"
hubbit-console = "hubbit.console:main"
hubbit-tui = "hubbit.tui:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hubbit"]

[tool.hatch.build.targets.sdist]
# explicit list: never ship local files such as .env
only-include = ["src", "tests", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Skip the per-machine settings files without looking at them: Claude Code's sandbox
# denies even a stat() on .env*, which otherwise breaks collection.
addopts = ["--ignore=.env", "--ignore=.env.example"]

[tool.uv.sources]
# PyPI 1.3.0 (2023) calls bleak.discover(), which bleak >= 1.0 removed.
# Master has the BleakScanner fix (#140, 2025-01-04) but no release yet.
pylgbst = { git = "https://github.com/undera/pylgbst", rev = "789a52e835ffc51920a8aa5a2011f7a919348a21" }
