name: Bug / hardware problem
description: Something doesn't work (connection, platform, script)
labels: [bug]
body:
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [macOS, Ubuntu, Kali, Raspberry Pi OS, Windows, other]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Command run, output / traceback, what you expected.
    validations:
      required: true
