name: Release

# Runs when an admin pushes a tag vX.Y.Z (only admins may create v* tags: tag ruleset).
# Builds sdist + wheel, attests their provenance and creates the GitHub Release with the
# matching CHANGELOG.md section as notes. No PyPI upload: PyPI rejects our git pin of pylgbst.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      id-token: write # sign the provenance attestation
      attestations: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Tag must match the version in pyproject.toml
        run: |
          version=$(uv version --short)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG does not match pyproject version $version"
            exit 1
          fi
      - run: uv sync --locked
      - run: uv run pytest -q
      - run: uv build
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="${TAG#v}" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::no CHANGELOG.md section for ${TAG#v}"
            exit 1
          fi
      - name: Create the GitHub Release
        run: gh release create "$TAG" dist/* --title "$TAG" --notes-file notes.md --verify-tag
