name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - name: Smoke test entry points
        run: uv run boost-scan --help
      - name: Smoke test Windows launcher
        if: runner.os == 'Windows'
        shell: cmd
        env:
          LEGO_BOOST_NO_PAUSE: "1"
        run: call windows\_run.cmd boost-scan --help
