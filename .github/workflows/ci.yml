name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - name: Smoke test entry points
        run: |
          uv run hubbit-scan --help
          uv run hubbit-console --help
          uv run hubbit-tui --help
      - name: Smoke test simulated console session
        shell: bash
        run: |
          printf 'forward 0.2\nled red\nraw\nmotor A 30 0.2\nbattery\nexit\n' | uv run hubbit-console --simulate
          printf 'vor 0.2\nlicht rot\nroh\nwinkel A 90\nbatterie\nende\n' | uv run hubbit-console --simulate --lang de
      - name: Smoke test Windows launcher
        if: runner.os == 'Windows'
        shell: cmd
        env:
          HUBBIT_NO_PAUSE: "1"
        run: call windows\_run.cmd hubbit-scan --help
