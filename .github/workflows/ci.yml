name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - name: Smoke test entry points
        run: |
          uv run boost-scan --help
          uv run boost-console --help
      - name: Smoke test simulated console session
        shell: bash
        run: printf 'forward 0.2\nled red\nraw\nmotor A 30 0.2\nbattery\nexit\n' | uv run boost-console --simulate
      - name: Smoke test Windows launcher
        if: runner.os == 'Windows'
        shell: cmd
        env:
          LEGO_BOOST_NO_PAUSE: "1"
        run: call windows\_run.cmd boost-scan --help
