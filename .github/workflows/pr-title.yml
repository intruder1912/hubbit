name: PR title

# We squash-merge, so the PR title becomes the commit on main: it must follow
# Conventional Commits (the changelog is generated from it, see docs/releasing.md).
# The title is only read from an environment variable, never interpolated into the script.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  conventional-title:
    name: conventional title
    runs-on: ubuntu-latest
    steps:
      - name: Check the PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|test|refactor|perf|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: [^ ].*'
          if printf '%s\n' "$TITLE" | grep -Eq "$pattern"; then
            echo "OK: $TITLE"
          else
            echo "::error::PR title must look like 'fix(tui): stop hangs on quit' (Conventional Commits). Types: feat fix docs test refactor perf build ci chore revert"
            exit 1
          fi
